name: tutor_language
description: "Adaptive offline language tutor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  just_audio: ^0.10.6
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/languages/spanish/language.json
    - assets/languages/spanish/vocabulary/
    - assets/languages/spanish/grammar/
    - assets/languages/spanish/templates/
    - assets/languages/spanish/dialogues/
    - assets/languages/spanish/readings/
    - assets/languages/spanish/curriculum/
    - assets/languages/spanish/curriculum/lessons/
    - assets/languages/spanish/localization/
    - assets/languages/spanish/localization/semantic/
    - assets/languages/spanish/localization/semantic/manifests/
    - assets/languages/spanish/localization/semantic/uk/
    - assets/languages/spanish/localization/semantic/ru/
    - assets/languages/spanish/pronunciation/
    - assets/languages/spanish/audio/
    - assets/languages/spanish/audio/reference/

  fonts:
    - family: Kurale
      fonts:
        - asset: assets/fonts/kurale/Kurale-Regular.ttf
          weight: 400
